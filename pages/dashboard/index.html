<!doctype html>
<!--
  PriceFinder WebUI — 商品比价仪表盘
  遵循 AstrBot 插件 Pages 规范，由 Dashboard 通过 iframe 嵌入。
  Bridge: window.AstrBotPluginPage 提供 API 通信和主题/语言同步。
  入口脚本: app.js（ES module）
  三页合一：商品比价 / 查询历史 / 收藏夹，Header Tab 切换
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PriceFinder</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- ====== 顶部导航栏 ====== -->
<header class="header">
  <div class="header-title">
    PriceFinder 商品比价
  </div>
  <div class="header-actions">
    <label class="debug-toggle" title="调试模式">
      <span class="debug-toggle-label">调试模式</span>
      <input type="checkbox" id="debugToggle" />
      <span class="debug-toggle-slider"></span>
    </label>
    <button class="header-tab active" data-page="dashboard">🔍 商品比价</button>
    <button class="header-tab" data-page="favorites">⭐ 收藏夹</button>
    <button class="theme-toggle" id="themeBtn">🌙 暗色模式</button>
  </div>
</header>

<!-- ====== Page: 商品比价（默认） ====== -->
<section class="page active" id="page-dashboard">

  <section class="stats-row" id="dashboardStats"></section>

  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" id="dashboardSearchInput" placeholder="搜索关键词、品牌、商品名..." />
      <button class="btn-reset" id="dashboardBtnReset" title="清除">✕</button>
      <button class="btn-search" id="dashboardBtnSearch" title="搜索">🔍</button>
    </div>
  </div>

  <div class="main-grid">
    <aside class="sidebar" id="dashboardSidebar"></aside>
    <div class="table-area">
      <div class="table-toolbar">
        <span class="table-info" id="dashboardTableInfo">共 <strong>0</strong> 条记录</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead id="dashboardTableHead"></thead>
          <tbody id="dashboardTableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="dashboardPagination"></div>
    </div>
  </div>

</section>

<!-- ====== Page: 收藏夹 ====== -->
<section class="page" id="page-favorites">

  <section class="stats-row" id="favStats"></section>

  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="text" id="favSearchInput" placeholder="搜索关键词、品牌、商品名..." />
      <button class="btn-reset" id="favBtnReset" title="清除">✕</button>
      <button class="btn-search" id="favBtnSearch" title="搜索">🔍</button>
    </div>
  </div>

  <div class="main-grid">
    <aside class="sidebar" id="favSidebar"></aside>
    <div class="table-area">
      <div class="table-toolbar">
        <span class="table-info" id="favTableInfo">共 <strong>0</strong> 条记录</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead id="favTableHead"></thead>
          <tbody id="favTableBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="favPagination"></div>
    </div>
  </div>

</section>

<!-- ====== Toast 通知浮层 ====== -->
<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>

</body>
</html>
